<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Món quà dành tặng Mẹ</title>
    <!-- Phông chữ Google Fonts dịu nhẹ, mộc mạc -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&family=Quicksand:wght@400;500;600&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Quicksand', sans-serif;
            background: linear-gradient(135deg, #fff5f5 0%, #fed7aa 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #4a3b32;
            overflow-x: hidden;
        }

        /* Container chính */
        .container {
            width: 90%;
            max-width: 600px;
            text-align: center;
            position: relative;
        }

        /* --- TRANG CHỦ (LANDING PAGE) --- */
        #landing-page {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(8px);
            padding: 50px 30px;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.6);
            transition: opacity 0.8s ease, transform 0.8s ease;
        }

        .subtitle {
            font-size: 0.95rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #c05621;
            font-weight: 600;
            margin-bottom: 12px;
        }

        .main-title {
            font-family: 'Dancing Script', cursive;
            font-size: 2.8rem;
            color: #7b341e;
            line-height: 1.3;
            margin-bottom: 16px;
        }

        .date-badge {
            display: inline-block;
            background-color: #feebc8;
            color: #9c4221;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 35px;
        }

        /* Nút bấm mở món quà */
        .open-btn {
            background: linear-gradient(135deg, #dd6b20 0%, #c05621 100%);
            color: #ffffff;
            border: none;
            padding: 16px 36px;
            font-size: 1rem;
            font-weight: 600;
            font-family: 'Quicksand', sans-serif;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(192, 86, 33, 0.3);
            transition: all 0.3s ease;
        }

        .open-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(192, 86, 33, 0.4);
        }

        .open-btn:active {
            transform: translateY(1px);
        }

        /* --- TRANG NỘI DUNG CHÍNH (MAIN CONTENT PAGE) --- */
        #main-content {
            display: none; /* Mặc định ẩn */
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.8s ease, transform 0.8s ease;
            background: rgba(255, 255, 255, 0.9);
            padding: 40px 30px;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
        }

        /* Lớp ẩn hiệu ứng khi nhấn nút */
        .fade-out {
            opacity: 0 !important;
            transform: translateY(-20px) !important;
            pointer-events: none;
        }

        .fade-in {
            display: block !important;
            opacity: 1 !important;
            transform: translateY(0) !important;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 1. TRANG CHỦ -->
        <section id="landing-page">
            <p class="subtitle">Món quà nhỏ dành cho Mẹ</p>
            <h1 class="main-title">Chúc mừng Bổn mạng<br>Thánh Marta</h1>
            <div class="date-badge">29 tháng 07, 2026</div>
            <br>
            <button class="open-btn" onclick="openGift()">Nhấn vào đây để mở món quà ♡</button>
        </section>

        <!-- 2. TRANG NỘI DUNG CHÍNH (Sẽ code tiếp ở bước sau) -->
        <section id="main-content">
            <h2 style="font-family: 'Dancing Script', cursive; font-size: 2.2rem; color: #7b341e; margin-bottom: 15px;">Món quà của Mẹ ở đây</h2>
            <p style="color: #666; line-height: 1.6;">(Nội dung Lời chúc, Nhạc, Video, Thiệp và Góc viết nhắn gửi sẽ nằm ở phần này)</p>
        </section>
    </div>

    <script>
        function openGift() {
            const landing = document.getElementById('landing-page');
            const mainContent = document.getElementById('main-content');

            // Hiệu ứng ẩn trang chủ
            landing.classList.add('fade-out');

            // Sau 0.8s thì ẩn hẳn trang chủ và hiện trang nội dung
            setTimeout(() => {
                landing.style.display = 'none';
                mainContent.classList.add('fade-in');
            }, 800);
        }
    </script>
</body>
</html>
